<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Иру-слешер</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
            z-index: 10;
        }
        #health-bar {
            width: 200px;
            height: 20px;
            background: rgba(255, 0, 0, 0.5);
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: #00ff00;
            transition: width 0.2s;
        }
        #score {
            font-size: 24px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 10px white;
        }
        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
        }
        .menu h1 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #ff00ff;
        }
        .menu button {
            padding: 15px 40px;
            font-size: 24px;
            margin: 10px;
            cursor: pointer;
            background: #4a0080;
            color: white;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .menu button:hover {
            background: #ff00ff;
            transform: scale(1.05);
        }
        .weapon-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
        }
        .weapon-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            width: 150px;
            text-align: center;
        }
        .weapon-card:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: scale(1.05);
        }
        .weapon-card.selected {
            background: rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 20px #ff00ff;
        }
        .weapon-icon {
            font-size: 48px;
        }
        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.2s;
        }
        #pause-menu {
            display: none;
        }
        #game-over {
            display: none;
        }
        #start-menu {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="health-bar"><div id="health-fill"></div></div>
        <div id="score">Счёт: 0</div>
        <div style="font-size:14px; margin-top:5px;">Escape — пауза | ЛКМ — удар | WASD — движение</div>
    </div>
    <div id="crosshair"></div>
    <div id="damage-flash"></div>

    <!-- Стартовое меню (выбор оружия) -->
    <div id="start-menu" class="menu">
        <h1>Выбери оружие</h1>
        <div class="weapon-list" id="weapon-list-start"></div>
        <button id="start-btn">Начать бой</button>
    </div>

    <!-- Меню паузы -->
    <div id="pause-menu" class="menu">
        <h1>ПАУЗА</h1>
        <div class="weapon-list" id="weapon-list-pause"></div>
        <button id="resume-btn">Продолжить</button>
        <button id="restart-btn">Заново</button>
    </div>

    <!-- Game over -->
    <div id="game-over" class="menu">
        <h1>ТЫ ПАЛ...</h1>
        <p style="font-size:24px;">Финальный счёт: <span id="final-score">0</span></p>
        <button id="try-again-btn">Попробовать снова</button>
    </div>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== ДАННЫЕ ОРУЖИЯ ====================
        const WEAPONS = {
            sword: {
                name: 'Меч',
                icon: '⚔️',
                damage: 25,
                range: 3.5,
                cooldown: 0.4,
                color: 0xcccccc,
                size: [0.1, 1.2, 0.1]
            },
            axe: {
                name: 'Топор',
                icon: '🪓',
                damage: 45,
                range: 2.8,
                cooldown: 0.8,
                color: 0x8B4513,
                size: [0.3, 0.8, 0.1]
            },
            spear: {
                name: 'Копьё',
                icon: '🔱',
                damage: 20,
                range: 5.0,
                cooldown: 0.5,
                color: 0xDEB887,
                size: [0.05, 2.0, 0.05]
            },
            hammer: {
                name: 'Молот',
                icon: '🔨',
                damage: 60,
                range: 2.5,
                cooldown: 1.0,
                color: 0x555555,
                size: [0.4, 0.6, 0.4]
            }
        };

        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer;
        let player;
        let playerSpeed = 6;
        let playerHealth = 100;
        let maxHealth = 100;
        let score = 0;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;

        let currentWeaponKey = 'sword';
        let currentWeapon = null;
        let weaponMesh = null;
        let lastAttackTime = 0;
        let isAttacking = false;
        let attackAnimTime = 0;

        let enemies = [];
        let clock;

        // Управление
        const keys = {};
        const mouse = { x: 0, y: 0 };

        // Камера (от третьего лица)
        const cameraOffset = new THREE.Vector3(0, 4, 7);
        const cameraLookOffset = new THREE.Vector3(0, 1.5, 0);

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0033);
            scene.fog = new THREE.Fog(0x1a0033, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Освещение
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff00ff, 0.5, 30);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            // Земля
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a1a3a, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Сетка на земле
            const gridHelper = new THREE.GridHelper(100, 50, 0x6622aa, 0x331155);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Декоративные колонны
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const dist = 25;
                const pillarGeo = new THREE.CylinderGeometry(0.8, 1, 8, 8);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x3a2a4a });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(Math.cos(angle) * dist, 4, Math.sin(angle) * dist);
                pillar.castShadow = true;
                scene.add(pillar);

                // Светящийся шар на колонне
                const orbGeo = new THREE.SphereGeometry(0.5);
                const orbMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 2 });
                const orb = new THREE.Mesh(orbGeo, orbMat);
                orb.position.set(Math.cos(angle) * dist, 8.5, Math.sin(angle) * dist);
                scene.add(orb);
            }

            // Создаём игрока
            createPlayer();

            // Создаём оружие
            updateWeaponMesh();

            // Привязка событий
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Меню
            setupMenus();

            // Спавн первых врагов
            spawnEnemy();
            spawnEnemy();
            spawnEnemy();

            animate();
        }

        // ==================== СОЗДАНИЕ ИГРОКА ====================
        function createPlayer() {
            player = new THREE.Group();

            // Тело
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2266cc });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            body.castShadow = true;
            player.add(body);

            // Голова
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            head.castShadow = true;
            player.add(head);

            // Шлем
            const helmGeo = new THREE.ConeGeometry(0.45, 0.5, 8);
            const helmMat = new THREE.MeshStandardMaterial({ color: 0xccaa00, metalness: 0.8, roughness: 0.2 });
            const helm = new THREE.Mesh(helmGeo, helmMat);
            helm.position.y = 2.3;
            helm.castShadow = true;
            player.add(helm);

            // Ноги
            const legGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 6);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.25, 0.4, 0);
            legL.castShadow = true;
            player.add(legL);
            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.25, 0.4, 0);
            legR.castShadow = true;
            player.add(legR);

            player.position.set(0, 0, 0);
            scene.add(player);
        }

        // ==================== ОРУЖИЕ ====================
        function updateWeaponMesh() {
            if (weaponMesh) {
                player.remove(weaponMesh);
            }
            const w = WEAPONS[currentWeaponKey];
            currentWeapon = w;

            weaponMesh = new THREE.Group();

            // Рукоять
            const handleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 6);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x4a2a0a });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0.25;
            weaponMesh.add(handle);

            // Клинок / головка
            const bladeGeo = new THREE.BoxGeometry(w.size[0], w.size[1], w.size[2]);
            const bladeMat = new THREE.MeshStandardMaterial({ color: w.color, metalness: 0.7, roughness: 0.3 });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 0.5 + w.size[1] / 2;
            blade.castShadow = true;
            weaponMesh.add(blade);

            // Позиционируем оружие в правой руке
            weaponMesh.position.set(0.6, 1.3, 0);
            weaponMesh.rotation.z = -0.3;
            player.add(weaponMesh);
        }

        // ==================== ВРАГИ ====================
        function spawnEnemy() {
            const enemy = new THREE.Group();

            // Тело — призрачный монстр
            const bodyGeo = new THREE.ConeGeometry(0.6, 1.8, 6);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xaa00aa,
                emissive: 0x550055,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.9
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            body.castShadow = true;
            enemy.add(body);

            // Глаза
            const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.2, 1.5, 0.45);
            enemy.add(eyeL);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.2, 1.5, 0.45);
            enemy.add(eyeR);

            // Руки
            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 6);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x880088 });
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-0.5, 1.2, 0);
            armL.rotation.z = 0.5;
            enemy.add(armL);
            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(0.5, 1.2, 0);
            armR.rotation.z = -0.5;
            enemy.add(armR);

            // Спавн на случайной позиции вокруг игрока
            const angle = Math.random() * Math.PI * 2;
            const dist = 12 + Math.random() * 8;
            enemy.position.set(
                player.position.x + Math.cos(angle) * dist,
                0,
                player.position.z + Math.sin(angle) * dist
            );

            enemy.userData = {
                health: 50 + Math.floor(score / 5) * 10,
                maxHealth: 50 + Math.floor(score / 5) * 10,
                speed: 1.5 + Math.random() * 1.5 + score * 0.02,
                attackCooldown: 0,
                attackRange: 2.0,
                damage: 10,
                hitFlash: 0
            };

            scene.add(enemy);
            enemies.push(enemy);
        }

        // ==================== УПРАВЛЕНИЕ ====================
        function onKeyDown(e) {
            keys[e.code] = true;

            if (e.code === 'Escape') {
                if (isGameStarted && !isGameOver) {
                    togglePause();
                }
            }
        }

        function onKeyUp(e) {
            keys[e.code] = false;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseDown(e) {
            if (e.button === 0 && isGameStarted && !isPaused && !isGameOver) {
                tryAttack();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== АТАКА ====================
        function tryAttack() {
            const now = performance.now() / 1000;
            if (now - lastAttackTime < currentWeapon.cooldown) return;
            lastAttackTime = now;
            isAttacking = true;
            attackAnimTime = 0;

            // Проверяем попадание по врагам в радиусе
            const attackRange = currentWeapon.range;
            const damage = currentWeapon.damage;

            // Направление взгляда игрока (по камере)
            const lookDir = new THREE.Vector3();
            camera.getWorldDirection(lookDir);
            lookDir.y = 0;
            lookDir.normalize();

            enemies.forEach(enemy => {
                const toEnemy = new THREE.Vector3().subVectors(enemy.position, player.position);
                toEnemy.y = 0;
                const dist = toEnemy.length();

                if (dist <= attackRange) {
                    toEnemy.normalize();
                    const dot = toEnemy.dot(lookDir);
                    // Если враг в пределах ±90 градусов от направления взгляда
                    if (dot > 0.0) {
                        // Наносим урон
                        enemy.userData.health -= damage;
                        enemy.userData.hitFlash = 1;

                        // Отбрасывание
                        const knockback = toEnemy.multiplyScalar(1.5);
                        enemy.position.add(knockback);

                        // Эффект попадания
                        createHitEffect(enemy.position);

                        if (enemy.userData.health <= 0) {
                            killEnemy(enemy);
                        }
                    }
                }
            });
        }

        function createHitEffect(pos) {
            const geo = new THREE.SphereGeometry(0.5, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 1 });
            const effect = new THREE.Mesh(geo, mat);
            effect.position.copy(pos);
            effect.position.y += 1;
            scene.add(effect);

            // Анимация исчезновения
            let life = 0.3;
            const animateEffect = () => {
                life -= 0.05;
                if (life <= 0) {
                    scene.remove(effect);
                    return;
                }
                effect.scale.setScalar(1 + (0.3 - life) * 3);
                effect.material.opacity = life / 0.3;
                requestAnimationFrame(animateEffect);
            };
            animateEffect();
        }

        function killEnemy(enemy) {
            const idx = enemies.indexOf(enemy);
            if (idx > -1) {
                enemies.splice(idx, 1);
                scene.remove(enemy);
                score += 10;
                document.getElementById('score').textContent = 'Счёт: ' + score;

                // Спавним нового врага
                setTimeout(() => {
                    if (isGameStarted && !isGameOver) {
                        spawnEnemy();
                        if (score > 100 && enemies.length < 8) spawnEnemy();
                    }
                }, 1000);
            }
        }

        // ==================== УРОН ИГРОКУ ====================
        function damagePlayer(amount) {
            playerHealth -= amount;
            if (playerHealth < 0) playerHealth = 0;

            // Эффект вспышки
            const flash = document.getElementById('damage-flash');
            flash.style.opacity = '0.5';
            setTimeout(() => flash.style.opacity = '0', 200);

            updateHealthBar();

            if (playerHealth <= 0 && !isGameOver) {
                gameOver();
            }
        }

        function updateHealthBar() {
            const pct = (playerHealth / maxHealth) * 100;
            const fill = document.getElementById('health-fill');
            fill.style.width = pct + '%';
            fill.style.background = pct > 50 ? '#00ff00' : pct > 25 ? '#ffaa00' : '#ff0000';
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('pause-menu').style.display = 'none';
        }

        // ==================== ПАУЗА ====================
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
            if (isPaused) {
                document.getElementById('weapon-list-pause').innerHTML =
                    document.getElementById('weapon-list-start').innerHTML;
                // Перепривязываем обработчики
                document.querySelectorAll('#weapon-list-pause .weapon-card').forEach(card => {
                    card.onclick = () => {
                        selectWeapon(card.dataset.key);
                    };
                });
                highlightSelectedWeapon();
            }
        }

        // ==================== МЕНЮ ====================
        function setupMenus() {
            const startList = document.getElementById('weapon-list-start');
            const pauseList = document.getElementById('weapon-list-pause');

            function buildWeaponCards(container) {
                container.innerHTML = '';
                Object.keys(WEAPONS).forEach(key => {
                    const w = WEAPONS[key];
                    const card = document.createElement('div');
                    card.className = 'weapon-card';
                    card.dataset.key = key;
                    card.innerHTML = `
                        <div class="weapon-icon">${w.icon}</div>
                        <div style="font-size:18px;margin:10px 0;">${w.name}</div>
                        <div style="font-size:12px;color:#aaa;">Урон: ${w.damage}</div>
                        <div style="font-size:12px;color:#aaa;">Дальность: ${w.range}</div>
                        <div style="font-size:12px;color:#aaa;">Перезарядка: ${w.cooldown}с</div>
                    `;
                    card.onclick = () => selectWeapon(key);
                    container.appendChild(card);
                });
            }

            buildWeaponCards(startList);
            buildWeaponCards(pauseList);

            // Старт
            document.getElementById('start-btn').onclick = () => {
                isGameStarted = true;
                isPaused = false;
                document.getElementById('start-menu').style.display = 'none';
            };

            // Продолжить
            document.getElementById('resume-btn').onclick = () => {
                togglePause();
            };

            // Заново (из паузы)
            document.getElementById('restart-btn').onclick = () => {
                restartGame();
            };

            // Попробовать снова (game over)
            document.getElementById('try-again-btn').onclick = () => {
                restartGame();
            };
        }

        function selectWeapon(key) {
            currentWeaponKey = key;
            updateWeaponMesh();
            highlightSelectedWeapon();
        }

        function highlightSelectedWeapon() {
            document.querySelectorAll('.weapon-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.key === currentWeaponKey);
            });
        }

        // ==================== РЕСТАРТ ====================
        function restartGame() {
            // Удаляем врагов
            enemies.forEach(e => scene.remove(e));
            enemies = [];

            // Сброс состояния
            playerHealth = maxHealth;
            score = 0;
            isGameOver = false;
            isPaused = false;
            isGameStarted = true;
            player.position.set(0, 0, 0);
            player.rotation.set(0, 0, 0);

            updateHealthBar();
            document.getElementById('score').textContent = 'Счёт: 0';

            // Скрываем меню
            document.getElementById('pause-menu').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-menu').style.display = 'none';

            // Спавним врагов
            for (let i = 0; i < 3; i++) spawnEnemy();
        }

        // ==================== ОБНОВЛЕНИЕ ====================
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (isGameStarted && !isPaused && !isGameOver) {
                updatePlayer(delta);
                updateEnemies(delta);
                updateAttackAnimation(delta);
            }

            updateCamera(delta);

            renderer.render(scene, camera);
        }

        function updatePlayer(delta) {
            // Движение относительно камеры
            const moveDir = new THREE.Vector3();
            const camForward = new THREE.Vector3();
            camera.getWorldDirection(camForward);
            camForward.y = 0;
            camForward.normalize();

            const camRight = new THREE.Vector3();
            camRight.crossVectors(camForward, new THREE.Vector3(0, 1, 0)).normalize();

            if (keys['KeyW']) moveDir.add(camForward);
            if (keys['KeyS']) moveDir.sub(camForward);
            if (keys['KeyD']) moveDir.add(camRight);
            if (keys['KeyA']) moveDir.sub(camRight);

            if (moveDir.length() > 0) {
                moveDir.normalize();
                player.position.addScaledVector(moveDir, playerSpeed * delta);

                // Поворот игрока в сторону движения (плавно)
                const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                let currentAngle = player.rotation.y;
                let diff = targetAngle - currentAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.rotation.y += diff * 10 * delta;
            }

            // Ограничение по арене
            const limit = 45;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));
        }

        function updateEnemies(delta) {
            enemies.forEach(enemy => {
                const ud = enemy.userData;

                // Мигание при попадании
                if (ud.hitFlash > 0) {
                    ud.hitFlash -= delta * 5;
                    const flash = Math.max(0, ud.hitFlash);
                    enemy.children.forEach(child => {
                        if (child.material && child.material.emissive) {
                            child.material.emissiveIntensity = 0.5 + flash * 3;
                        }
                    });
                }

                // Движение к игроку
                const toPlayer = new THREE.Vector3().subVectors(player.position, enemy.position);
                toPlayer.y = 0;
                const dist = toPlayer.length();

                if (dist > ud.attackRange) {
                    toPlayer.normalize();
                    enemy.position.addScaledVector(toPlayer, ud.speed * delta);

                    // Поворот к игроку
                    enemy.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
                } else {
                    // Атака
                    ud.attackCooldown -= delta;
                    if (ud.attackCooldown <= 0) {
                        ud.attackCooldown = 1.5;
                        damagePlayer(ud.damage);

                        // Визуальный рывок
                        const lunge = toPlayer.clone().normalize().multiplyScalar(0.3);
                        enemy.position.add(lunge);
                    }
                }

                // Пульсация
                const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.05;
                enemy.scale.setScalar(pulse);
            });
        }

        function updateAttackAnimation(delta) {
            if (isAttacking) {
                attackAnimTime += delta;
                const duration = 0.3;
                const t = attackAnimTime / duration;

                if (t >= 1) {
                    isAttacking = false;
                    weaponMesh.rotation.x = 0;
                    weaponMesh.rotation.z = -0.3;
                } else {
                    // Анимация взмаха
                    const swing = Math.sin(t * Math.PI);
                    weaponMesh.rotation.x = -swing * 2.5;
                    weaponMesh.rotation.z = -0.3 - swing * 0.5;
                }
            }
        }

        function updateCamera(delta) {
            // Камера следует за игроком
            const targetPos = player.position.clone().add(cameraOffset);

            // Плавное следование
            camera.position.lerp(targetPos, 5 * delta);

            // Смотрим на игрока
            const lookTarget = player.position.clone().add(cameraLookOffset);
            camera.lookAt(lookTarget);
        }

        // ==================== ЗАПУСК ====================
        init();
        highlightSelectedWeapon();
        updateHealthBar();
    </script>
</body>
</html>
